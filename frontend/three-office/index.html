<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinach OS — 3D Office</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="three-container" style="width: 100vw; height: 100vh;"></div>
    <div id="ui-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;">
      <!-- Room navigation buttons -->
      <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; pointer-events: auto;">
        <button id="btn-ceo-room" class="room-btn">CEO Room</button>
        <button id="btn-cto-room" class="room-btn">CTO Room</button>
        <button id="btn-sales-room" class="room-btn">Sales Room</button>
        <button id="btn-content-room" class="room-btn">Content Studio</button>
        <button id="btn-design-room" class="room-btn">Design Studio</button>
        <button id="btn-eng-room" class="room-btn">Engineering Lab</button>
        <button id="btn-ops-room" class="room-btn">Ops Control</button>
        <button id="btn-exit-room" class="room-btn exit-btn">Exit Room</button>
      </div>
      
      <!-- Agent status panel -->
      <div id="agent-panel" style="position: absolute; top: 20px; right: 20px; width: 280px; max-height: 60vh; overflow-y: auto; pointer-events: auto;">
        <!-- Populated by JS -->
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <style>
      .room-btn {
        padding: 8px 16px;
        background: rgba(26, 26, 46, 0.9);
        border: 1px solid rgba(76, 175, 80, 0.3);
        color: #4CAF50;
        border-radius: 8px;
        font-size: 12px;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        transition: all 0.2s;
        backdrop-filter: blur(10px);
      }
      .room-btn:hover {
        background: rgba(76, 175, 80, 0.2);
        border-color: #4CAF50;
      }
      .room-btn.exit-btn {
        background: rgba(244, 67, 54, 0.1);
        border-color: rgba(244, 67, 54, 0.3);
        color: #F44336;
      }
      .room-btn.exit-btn:hover {
        background: rgba(244, 67, 54, 0.2);
        border-color: #F44336;
      }
      
      #agent-panel .agent-card {
        background: rgba(18, 18, 20, 0.95);
        border: 1px solid rgba(76, 175, 80, 0.2);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 8px;
        backdrop-filter: blur(10px);
      }
      #agent-panel .agent-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      #agent-panel .agent-avatar {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }
      #agent-panel .agent-info {
        flex: 1;
      }
      #agent-panel .agent-name {
        font-weight: 600;
        font-size: 13px;
        color: #fff;
      }
      #agent-panel .agent-category {
        font-size: 10px;
        color: #888;
        text-transform: uppercase;
      }
      #agent-panel .agent-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
      }
      #agent-panel .agent-status.idle { background: rgba(158, 158, 158, 0.2); color: #9e9e9e; }
      #agent-panel .agent-status.thinking { background: rgba(255, 152, 0, 0.2); color: #FF9800; }
      #agent-panel .agent-status.working { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
      #agent-panel .agent-status.speaking { background: rgba(156, 39, 176, 0.2); color: #9C27B0; }
      #agent-panel .agent-status.blocked { background: rgba(244, 67, 54, 0.2); color: #F44336; }
      #agent-panel .agent-activity {
        font-size: 11px;
        color: #aaa;
        margin-top: 4px;
      }
    </style>
  </body>
</html>
